name: prediction-engine
on:
  push:
    paths: ["apps/prediction-engine/**", "packages/api-contracts/**"]
  pull_request:
    paths: ["apps/prediction-engine/**", "packages/api-contracts/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/prediction-engine/requirements.txt
      - run: cd apps/prediction-engine && pip install -r requirements.txt && pip install pytest==8.3.3
      - run: cd apps/prediction-engine && pytest
