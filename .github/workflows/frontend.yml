name: frontend
on:
  push:
    paths: ["apps/frontend/**", "packages/shared-types/**"]
  pull_request:
    paths: ["apps/frontend/**", "packages/shared-types/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json
      - run: cd apps/frontend && npm ci && npm test && npm run build
