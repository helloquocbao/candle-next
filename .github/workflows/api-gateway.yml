name: api-gateway
on:
  push:
    paths: ["apps/api-gateway/**", "packages/shared-types/**", "packages/api-contracts/**"]
  pull_request:
    paths: ["apps/api-gateway/**", "packages/shared-types/**", "packages/api-contracts/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"
          cache-dependency-path: apps/api-gateway/package-lock.json
      - run: cd apps/api-gateway && npm ci && npm test --if-present
