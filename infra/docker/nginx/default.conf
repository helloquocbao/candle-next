# =============================================================================
# infra/docker/nginx/default.conf
# Reverse proxy cho BACKEND của "Crypto Real-time Predictor Chart"
#
# Frontend KHÔNG chạy trong cụm này nữa — deploy riêng lên Vercel (static
# hosting). Domain mà nginx này phục vụ là domain BACKEND riêng (khuyến nghị
# subdomain, vd: api.yourdomain.com), để tách biệt hoàn toàn khỏi domain
# frontend trên Vercel (vd: yourdomain.com hoặc yourapp.vercel.app).
#
# Giả định:
#   - Service `api` (api-gateway) phục vụ REST trên port 8080 ở prefix
#     "/api/", và WebSocket trên CÙNG port 8080 nhưng ở path riêng "/ws"
#     (xem `new WebSocketServer({ server, path: '/ws' })` trong
#     apps/api-gateway/src/index.js).
#   - Frontend (trên Vercel) gọi tới domain này bằng absolute URL:
#     VITE_API_BASE_URL=https://api.yourdomain.com
#     VITE_WS_URL=wss://api.yourdomain.com/ws
#     (xem apps/frontend/.env.example và hướng dẫn set env trên Vercel trong
#     apps/frontend/README.md).
#   - Vì frontend và backend khác origin (khác domain/khác host Vercel vs
#     VPS), api-gateway BẮT BUỘC phải whitelist đúng domain Vercel trong
#     CORS_ORIGIN (xem .env ở root) — nếu không trình duyệt sẽ chặn request.
# =============================================================================

# =============================================================================
# CHẠY KHÔNG CÓ SSL (mặc định, dev/staging hoặc khi TLS được terminate ở tầng
# trước, vd load balancer của cloud provider) — HTTP thuần trên port 80.
#
# BẬT HTTPS CHO PRODUCTION: xem file default.conf.https-example trong cùng
# thư mục này. Copy nội dung đó thay thế file này sau khi đã có certs Let's
# Encrypt mount vào /etc/letsencrypt (xem docker-compose.yml).
# =============================================================================

# Rate limiting zone: giới hạn theo IP, áp dụng cho toàn bộ location bên dưới.
# 10 req/s trung bình, burst 20 request cho phép vượt tạm thời rồi delay.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types application/json application/javascript text/css text/plain;

server {
    listen 80;
    # Nginx image tu dong them "listen [::]:80;" qua entrypoint script
    # 10-listen-on-ipv6-by-default.sh — nhung script do PATCH TRUC TIEP file
    # config, trong khi file nay duoc mount read-only (volumes: ...:ro) nen
    # patch se fail silent (log "read-only file system?"). Container van
    # resolve "localhost" ra ::1 truoc (xem /etc/hosts), nen healthcheck
    # "wget http://localhost/health" se bi connection refused neu thieu dong
    # nay — phai khai bao IPv6 tuong minh o day thay vi dua vao script.
    listen [::]:80;
    server_name _;

    # Security headers — áp dụng cho toàn bộ response của server block này.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP tối thiểu — API/WS không serve HTML nên chặn hết là an toàn nhất.
    add_header Content-Security-Policy "default-src 'none'" always;

    client_max_body_size 1m;
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn api_conn 20;

    # Domain này chỉ phục vụ API/WS — không có frontend nào để trả về ở "/".
    location / {
        return 404 "Đây là backend API của Crypto Predictor. Frontend deploy riêng trên Vercel.\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------
    # REST API (proxy tới api-gateway, path /api/v1/... theo spec mục 5.1)
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # WebSocket Gateway (mục 5.2 spec: subscribe/kline/prediction/accuracy)
    # api-gateway lắng nghe WS đúng tại path "/ws" trên port 8080.
    # Không có trailing slash ở proxy_pass => giữ nguyên URI gốc ("/ws")
    # khi forward, khớp chính xác path mà WebSocketServer đang lắng nghe.
    # Rate limit không áp dụng cho WS handshake vì cần giữ kết nối dài hạn.
    # ---------------------------------------------------------------------
    location /ws {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket cần timeout dài hơn mặc định để giữ kết nối real-time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check pass-through (mục 5.1: GET /health) — không rate-limit để
    # load balancer/orchestrator luôn probe được.
    location /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
    }
}
